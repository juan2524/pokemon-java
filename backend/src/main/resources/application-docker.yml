spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/pokemon}
    username: ${SPRING_DATASOURCE_USERNAME:pokemon}
    password: ${SPRING_DATASOURCE_PASSWORD:pokemon}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  security:
    jwt-secret: ${JWT_SECRET:local-dev-jwt-secret-change-me-32b}
    jwt-ttl-seconds: 3600
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

pokeapi:
  base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}

server:
  port: 8080
